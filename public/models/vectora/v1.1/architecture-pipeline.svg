<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" height="100%" style="background:#0f172a; font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;">
  <defs>
    <linearGradient id="boxGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="activeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#64748b"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="40" y="38" fill="#f8fafc" font-size="18" font-weight="700" letter-spacing="0.05em">VECTORA v1.1 PROCESSING PIPELINE</text>
  <text x="40" y="60" fill="#94a3b8" font-size="12">Verified Character-Level Decoder-Only Transformer Architecture (631,168 parameters)</text>

  <!-- Flow connecting lines -->
  <path d="M 160 170 L 195 170" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)" fill="none"/>
  <path d="M 345 170 L 380 170" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)" fill="none"/>
  <path d="M 530 170 L 565 170" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)" fill="none"/>
  <path d="M 735 170 L 770 170" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)" fill="none"/>
  <path d="M 940 170 L 975 170" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)" fill="none"/>

  <!-- Stage 1: Text -->
  <g transform="translate(40, 100)" filter="url(#shadow)">
    <rect width="120" height="140" rx="8" fill="url(#boxGrad)" stroke="#334155" stroke-width="1.5"/>
    <rect width="120" height="4" rx="2" fill="#64748b"/>
    <text x="14" y="32" fill="#38bdf8" font-size="10" font-weight="600" text-transform="uppercase">Input</text>
    <text x="14" y="52" fill="#f1f5f9" font-size="13" font-weight="600">Raw Text</text>
    <text x="14" y="78" fill="#94a3b8" font-size="11">Shakespeare</text>
    <text x="14" y="96" fill="#94a3b8" font-size="11">corpus subset</text>
    <text x="14" y="122" fill="#cbd5e1" font-size="10" font-family="monospace">500k chars</text>
  </g>

  <!-- Stage 2: Char Vocab -->
  <g transform="translate(200, 100)" filter="url(#shadow)">
    <rect width="145" height="140" rx="8" fill="url(#boxGrad)" stroke="#334155" stroke-width="1.5"/>
    <rect width="145" height="4" rx="2" fill="#0ea5e9"/>
    <text x="14" y="32" fill="#38bdf8" font-size="10" font-weight="600" text-transform="uppercase">Tokenization</text>
    <text x="14" y="52" fill="#f1f5f9" font-size="13" font-weight="600">Char Vocab</text>
    <text x="14" y="78" fill="#94a3b8" font-size="11">string_to_int map</text>
    <text x="14" y="96" fill="#94a3b8" font-size="11">Vocabulary: 83</text>
    <text x="14" y="122" fill="#cbd5e1" font-size="10" font-family="monospace">(B, T) = (16, 128)</text>
  </g>

  <!-- Stage 3: Embeddings -->
  <g transform="translate(385, 100)" filter="url(#shadow)">
    <rect width="145" height="140" rx="8" fill="url(#boxGrad)" stroke="#334155" stroke-width="1.5"/>
    <rect width="145" height="4" rx="2" fill="#6366f1"/>
    <text x="14" y="32" fill="#818cf8" font-size="10" font-weight="600" text-transform="uppercase">Embeddings</text>
    <text x="14" y="52" fill="#f1f5f9" font-size="13" font-weight="600">Token + Pos</text>
    <text x="14" y="78" fill="#94a3b8" font-size="11">Token: 83 × 128</text>
    <text x="14" y="96" fill="#94a3b8" font-size="11">Pos: 128 × 128</text>
    <text x="14" y="122" fill="#cbd5e1" font-size="10" font-family="monospace">Out: (B, T, 128)</text>
  </g>

  <!-- Stage 4: Transformer Blocks -->
  <g transform="translate(570, 90)" filter="url(#shadow)">
    <rect width="165" height="160" rx="8" fill="url(#boxGrad)" stroke="#6366f1" stroke-width="2"/>
    <rect width="165" height="4" rx="2" fill="#a855f7"/>
    <text x="14" y="30" fill="#c084fc" font-size="10" font-weight="600" text-transform="uppercase">Transformer Stack</text>
    <text x="14" y="50" fill="#f1f5f9" font-size="13" font-weight="600">3 Blocks (Pre-LN)</text>
    <text x="14" y="74" fill="#94a3b8" font-size="11">• 4 Heads (dim=32)</text>
    <text x="14" y="92" fill="#94a3b8" font-size="11">• Causal Mask (128²)</text>
    <text x="14" y="110" fill="#94a3b8" font-size="11">• MLP: 128→512→128</text>
    <text x="14" y="128" fill="#94a3b8" font-size="11">• Exact GELU &amp; Drop 0.1</text>
    <text x="14" y="148" fill="#cbd5e1" font-size="10" font-family="monospace">State: (B, T, 128)</text>
  </g>

  <!-- Stage 5: Output Projection -->
  <g transform="translate(775, 100)" filter="url(#shadow)">
    <rect width="165" height="140" rx="8" fill="url(#boxGrad)" stroke="#334155" stroke-width="1.5"/>
    <rect width="165" height="4" rx="2" fill="#ec4899"/>
    <text x="14" y="32" fill="#f472b6" font-size="10" font-weight="600" text-transform="uppercase">Projection</text>
    <text x="14" y="52" fill="#f1f5f9" font-size="13" font-weight="600">LN + Tied Head</text>
    <text x="14" y="78" fill="#94a3b8" font-size="11">Final LayerNorm(128)</text>
    <text x="14" y="96" fill="#94a3b8" font-size="11">lm_head tied to token</text>
    <text x="14" y="122" fill="#cbd5e1" font-size="10" font-family="monospace">Logits: (B, T, 83)</text>
  </g>

  <!-- Stage 6: Next-Character Prediction -->
  <g transform="translate(980, 100)" filter="url(#shadow)">
    <rect width="180" height="140" rx="8" fill="url(#boxGrad)" stroke="#334155" stroke-width="1.5"/>
    <rect width="180" height="4" rx="2" fill="#10b981"/>
    <text x="14" y="32" fill="#34d399" font-size="10" font-weight="600" text-transform="uppercase">Prediction</text>
    <text x="14" y="52" fill="#f1f5f9" font-size="13" font-weight="600">Next Character</text>
    <text x="14" y="78" fill="#94a3b8" font-size="11">Train: Cross-Entropy</text>
    <text x="14" y="96" fill="#94a3b8" font-size="11">Loss: 1.366 tr / 1.485 val</text>
    <text x="14" y="122" fill="#cbd5e1" font-size="10" font-family="monospace">Infer: Top-40 sampling</text>
  </g>
</svg>
